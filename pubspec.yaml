name: qurity
description: "تطبيق قرية أبوديشيشة - التطبيق المجتمعي لخدمة قرى المنطقة"
publish_to: 'none'

version: 1.1.37+2037

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  google_sign_in: 6.3.0
  firebase_auth: ^6.5.4
  firebase_messaging: ^16.4.1
  image_picker: ^1.2.2
  http: ^1.0.0
  url_launcher: ^6.0.0
  share_plus: ^13.2.0
  path_provider: ^2.1.4
  shared_preferences: ^2.0.0
  file_picker: ^13.1.0
  excel: ^4.0.6
  shimmer: ^3.0.0
  cached_network_image: ^3.0.0
  flutter_animate: ^4.0.0
  google_fonts: ^8.1.0
  flutter_tts: ^4.2.0
  flutter_rating_bar: ^4.0.0
  intl: ^0.20.2
  connectivity_plus: ^6.0.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  audioplayers: ^6.8.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  integration_test:
    sdk: flutter
  fake_cloud_firestore: ^4.2.0

# إصلاح بناء الويب: image_picker_for_web 3.1.1 لا يترجم مع package:web 1.1.x
dependency_overrides:
  web: ">=1.0.0 <1.1.0"

flutter:
  uses-material-design: true
  assets:
    - assets/images/letters/
    - assets/images/kids/num/
    - assets/images/kids/wudu/
    - assets/images/kids/salah/
    - assets/images/kids/prophets/
    - assets/images/kids/manners/
    - assets/images/crops/
    - assets/images/
    - assets/images/Qurity.png
    - assets/sounds/
