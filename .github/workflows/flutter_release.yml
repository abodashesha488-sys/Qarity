name: Qarity Flutter Build & Release

# فحصة بناء عند كل دفعة لـ main: analyze + بناء APK كأرتيفكت.
# - نشر الويب مسؤول عنه firebase-hosting-merge.yml (مخصص له).
# - نشر القواعد مسؤول عنه firebase_firestore_rules.yml (يعمل عند تغيرها).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: ✅ Run flutter analyze
        run: flutter analyze --no-fatal-infos

      # فحصة بناء الويب — تكتشف أخطاء التجميع الخاصة بالـ web مبكرًا.
      # النشر الفعلي يتم في firebase-hosting-merge.yml لتفادي التكرار/السباق.
      - name: 🌐 Verify web build
        run: flutter build web --release

      # APK غير موقّع كأرتيفكت فحص فقط — الإصدار الموقّع والـ Release
      # يبنيهما release-apk.yml الذي يشغّله sync.ps1.
      - name: 📱 Build APK Release
        run: flutter build apk --release

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qarity-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: 📱 Notify on success
        if: success()
        run: echo "✅ Build and artifact upload completed successfully!"
