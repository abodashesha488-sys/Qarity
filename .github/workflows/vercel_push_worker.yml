name: Qarity Vercel Push Notification Worker

on:
  push:
    branches: [main]
    paths:
      - 'api/push.js'
      - 'vercel.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: 📂 Checkout repository
      uses: actions/checkout@v3

      - name: 📤 Deploy to Vercel
        uses: amondet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
          alias-domains: true

      - name: 📋 Notification deployed
        run: echo "📡 Vercel push notification worker deployed"