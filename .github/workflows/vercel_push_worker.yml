name: Qarity Vercel Push Notification Worker

# ينشر عامل الإشعارات (api/push.js) على Vercel عند تغيّره.
# amondet/vercel-action محذوف من GitHub، لذا نستخدم Vercel CLI الرسمي مباشرة.
on:
  push:
    branches: [main]
    paths:
      - 'api/push.js'
      - 'vercel.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⬇️ Install Vercel CLI
        run: npm install --global vercel@latest

      # النشر إلى بيئة الإنتاج (production) — يحلّ محل alias-domains
      - name: 📤 Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes --cwd .

      - name: 📋 Notification deployed
        run: echo "📡 Vercel push notification worker deployed to production"
